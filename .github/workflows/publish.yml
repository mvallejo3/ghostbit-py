name: Publish to PyPI

on:
  push:
    branches: [main]

# Prevent overlapping publish runs
concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  check-version:
    name: Check if version needs publishing
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: get_version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Local version: $version"

      - name: Check if version already exists on PyPI
        id: check
        run: |
          version="${{ steps.get_version.outputs.version }}"
          # Query PyPI JSON API; 200 means the release already exists.
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/ghostbit/${version}/json")
          if [ "$status" = "200" ]; then
            echo "Version $version already on PyPI. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $version not found on PyPI. Will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    name: Build and publish
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ghostbit/${{ needs.check-version.outputs.version }}/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token needed.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Verify build artifacts
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
